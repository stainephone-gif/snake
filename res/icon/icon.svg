<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1456;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="snake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>

  <!-- Snake body -->
  <g filter="url(#glow)">
    <!-- Tail -->
    <circle cx="150" cy="400" r="35" fill="url(#snake)" opacity="0.6"/>
    <circle cx="150" cy="340" r="35" fill="url(#snake)" opacity="0.7"/>
    <circle cx="150" cy="280" r="35" fill="url(#snake)" opacity="0.8"/>

    <!-- Body curve -->
    <circle cx="210" cy="240" r="35" fill="url(#snake)" opacity="0.85"/>
    <circle cx="270" cy="220" r="35" fill="url(#snake)" opacity="0.9"/>
    <circle cx="330" cy="220" r="35" fill="url(#snake)" opacity="0.95"/>

    <!-- Head -->
    <circle cx="390" cy="220" r="45" fill="#ffff00" opacity="1"/>

    <!-- Eyes -->
    <circle cx="405" cy="210" r="8" fill="#0a0e27"/>
    <circle cx="405" cy="230" r="8" fill="#0a0e27"/>
  </g>

  <!-- Food -->
  <circle cx="390" cy="140" r="25" fill="#00ff88" filter="url(#glow)"/>

  <!-- Portal effect -->
  <circle cx="256" cy="380" r="40" fill="#aa00ff" opacity="0.3" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="30" fill="#aa00ff" opacity="0.5"/>
  <circle cx="256" cy="380" r="20" fill="#aa00ff" opacity="0.7"/>
</svg>
